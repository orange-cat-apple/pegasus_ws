name: Pegasus CI

on:
  pull_request:
    branches:
      - main

jobs:
  lint-and-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - run: pip install pre-commit catkin_pkg "empy<4" lark

      - run: pre-commit run --all-files

      - uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble

      - uses: ros-tooling/action-ros-ci@v0.3
        with:
          target-ros2-distro: humble

      - name: SITL Drill Gate
        run: |
          cd ros_ws
          colcon test --packages-select pegasus_autonomy pegasus_navigation pegasus_localization
          colcon test-result --all
